version: 2

# Descriptions and tests for the shop_clickhouse project. Tests run with `dbt build` right after the model they check.

seeds:
  - name: shopch_customers
    description: "Sample customers (CSV)."
  - name: shopch_products
    description: "Sample product catalogue (CSV)."
  - name: shopch_orders
    description: "Sample orders (CSV)."
  - name: shopch_order_items
    description: "Sample order lines (CSV)."

models:
  - name: fct_shopch_orders
    description: "One row per order with totals and a revenue flag."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'cancelled', 'returned']
      - name: order_total
        data_tests: [positive_value]
  - name: dim_shopch_customers
    description: "One row per customer with lifetime value and segment."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null]
      - name: customer_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low', 'no_purchases']
  - name: shopch_daily_revenue
    description: "Revenue per day with a running total."
    columns:
      - name: order_date
        data_tests: [unique, not_null]
      - name: revenue
        data_tests: [positive_value]
  - name: shopch_product_sales
    description: "Sales per product, ranked by revenue."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: revenue_rank
        data_tests: [unique]
  - name: shopch_category_summary
    description: "Revenue per category and its share of the total."
    columns:
      - name: category
        data_tests: [unique, not_null]
